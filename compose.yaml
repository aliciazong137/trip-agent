services:
  backend:
    build:
      context: .
      target: backend
    env_file: backend/.env
    restart: unless-stopped
    volumes:
      - trip_context:/app/backend/context
      - trip_memory:/app/data/memory
      - trip_usage:/app/data/usage
  web:
    build:
      context: .
      target: web
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"
volumes:
  trip_context:
  trip_memory:
  trip_usage:
